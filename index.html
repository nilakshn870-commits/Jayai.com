<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay AI - Dynamic User & Secret Aura System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #131314; color: #e3e3e3; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { 
            background: rgba(19, 19, 20, 0.85); 
            backdrop-filter: blur(12px); 
            padding: 14px 24px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 1px solid #232429;
            z-index: 10;
        }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 19px; color: #f0f0f0; }
        
        .brand-icon { 
            width: 36px; height: 36px; 
            background: linear-gradient(135deg, #4285f4, #9b51e0, #e91e63); 
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(155, 81, 224, 0.4);
            animation: pulseGlow 3s infinite alternate;
        }
        .brand-icon svg { width: 20px; height: 20px; fill: #ffffff; }

        .header-right { display: flex; align-items: center; gap: 14px; }

        /* Interactive Glowing Aura Badge */
        .aura-badge {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(236, 72, 153, 0.15));
            border: 1px solid rgba(168, 85, 247, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            color: #f472b6;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
            animation: auraGlow 2.5s infinite alternate;
            transition: transform 0.2s;
        }
        .aura-badge:hover { transform: scale(1.05); }

        .btn-secondary { background: #1c1d22; border: 1px solid #2d2f36; color: #9ca3af; cursor: pointer; font-size: 13px; font-weight: 500; padding: 8px 16px; border-radius: 20px; transition: all 0.2s; }
        .btn-secondary:hover { background: #282a32; color: #fff; border-color: #4b5563; }

        .btn-primary { 
            background: linear-gradient(135deg, #4285f4, #9b51e0); color: #ffffff; 
            border: none; cursor: pointer; font-size: 13px; font-weight: 600; 
            padding: 8px 18px; border-radius: 20px; transition: all 0.2s; 
        }
        .btn-primary:hover { opacity: 0.9; transform: scale(1.02); }

        .user-profile { display: none; align-items: center; gap: 10px; background: #1e1f20; padding: 4px 12px 4px 6px; border-radius: 20px; border: 1px solid #2d2f36; }
        .user-avatar { width: 28px; height: 28px; border-radius: 50%; background: #4285f4; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; }
        .user-name { font-size: 13px; font-weight: 500; color: #e3e3e3; }

        .main-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }

        #home-screen {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; text-align: center; max-width: 820px; margin: 0 auto; width: 100%;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        
        .hero-logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #4285f4, #9b51e0, #e91e63);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(155, 81, 224, 0.5);
            animation: pulseGlow 3s infinite alternate;
        }
        .hero-logo svg { width: 36px; height: 36px; fill: #ffffff; }

        .hero-title {
            font-size: 38px; font-weight: 700;
            background: linear-gradient(135deg, #4285f4, #a855f7, #ec4899);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .hero-subtitle { font-size: 18px; color: #8e8e93; margin-bottom: 32px; font-weight: 400; }

        .cards-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px; width: 100%; max-width: 760px;
        }
        .card {
            background: #1e1f20; border: 1px solid #2d2f36; border-radius: 16px;
            padding: 16px; text-align: left; cursor: pointer; transition: all 0.2s;
            display: flex; flex-direction: column; justify-content: space-between; height: 100px;
        }
        .card:hover { background: #282a2c; border-color: #4285f4; transform: translateY(-2px); }
        .card-text { font-size: 14px; color: #c4c7c5; line-height: 1.4; }
        .card-icon { align-self: flex-end; font-size: 16px; opacity: 0.7; }

        #chat-box { 
            flex: 1; padding: 24px 20px; overflow-y: auto; display: none; 
            flex-direction: column; gap: 20px; max-width: 820px; width: 100%; margin: 0 auto; 
        }
        
        .msg-row { display: flex; gap: 14px; width: 100%; animation: fadeIn 0.3s ease-out; }
        .user-row { justify-content: flex-end; }
        .ai-row { justify-content: flex-start; }

        .avatar { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .ai-avatar { background: linear-gradient(135deg, #4f46e5, #9333ea); box-shadow: 0 0 10px rgba(147, 51, 234, 0.3); }
        .ai-avatar svg { width: 18px; height: 18px; fill: #ffffff; }

        .msg { padding: 14px 20px; border-radius: 20px; max-width: 82%; font-size: 15px; line-height: 1.6; word-break: break-word; }
        .user { background: #27272a; color: #f4f4f5; border-bottom-right-radius: 6px; border: 1px solid #3f3f46; }
        .ai { background: #18181b; color: #e4e4e7; border-bottom-left-radius: 6px; border: 1px solid #27272a; }

        /* Important Text Glow Effect */
        .msg b, .msg strong {
            color: #c084fc;
            text-shadow: 0 0 8px rgba(192, 132, 252, 0.8), 0 0 16px rgba(168, 85, 247, 0.4);
            font-weight: 700;
        }

        .gen-img { width: 100%; max-width: 400px; border-radius: 16px; margin-top: 10px; border: 1px solid #3f3f46; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        .typing-cursor::after { content: '▋'; display: inline-block; margin-left: 4px; color: #a855f7; animation: blink 0.8s infinite; }

        .input-container { padding: 18px 20px; max-width: 820px; width: 100%; margin: 0 auto; }
        .input-box { 
            background: #1e1f20; border: 1px solid #2f3033; border-radius: 30px; 
            display: flex; align-items: center; padding: 6px 8px 6px 22px; transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }
        .input-box:focus-within { border-color: #a8c7fa; box-shadow: 0 0 15px rgba(168, 199, 250, 0.2); }
        input { flex: 1; background: transparent; border: none; outline: none; color: #f4f4f5; font-size: 15px; height: 42px; }
        input::placeholder { color: #8e8e93; }
        button.send-btn { 
            width: 42px; height: 42px; border-radius: 50%; border: none; 
            background: linear-gradient(135deg, #4285f4, #9b51e0); color: #ffffff; cursor: pointer; display: flex; 
            align-items: center; justify-content: center; transition: transform 0.2s, opacity 0.2s;
        }
        button.send-btn:hover { transform: scale(1.05); opacity: 0.95; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-card {
            background: #1e1f20; border: 1px solid #2d2f36; border-radius: 24px;
            padding: 32px; width: 100%; max-width: 380px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: fadeIn 0.25s ease-out;
            position: relative;
        }
        .close-btn { position: absolute; top: 16px; right: 20px; background: none; border: none; color: #8e8e93; font-size: 20px; cursor: pointer; }
        .modal-title { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 8px; }
        .modal-subtitle { font-size: 14px; color: #8e8e93; margin-bottom: 24px; }
        
        .form-input {
            width: 100%; background: #131314; border: 1px solid #2d2f36; border-radius: 12px;
            padding: 12px 16px; color: #fff; font-size: 14px; margin-bottom: 12px; outline: none;
        }
        .form-input:focus { border-color: #4285f4; }

        .google-btn {
            width: 100%; background: #282a2c; border: 1px solid #3c4043; color: #fff;
            padding: 12px; border-radius: 24px; font-size: 14px; font-weight: 500;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            cursor: pointer; transition: background 0.2s; margin-top: 8px;
        }
        .google-btn:hover { background: #333538; }

        @keyframes auraGlow {
            0% { box-shadow: 0 0 10px rgba(168, 85, 247, 0.4), 0 0 20px rgba(236, 72, 153, 0.2); }
            100% { box-shadow: 0 0 18px rgba(168, 85, 247, 0.8), 0 0 30px rgba(236, 72, 153, 0.5); }
        }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 10px rgba(155, 81, 224, 0.3); } 100% { box-shadow: 0 0 25px rgba(66, 133, 244, 0.6); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>
        </div>
        <span>Jay AI</span>
    </div>
    
    <div class="header-right">
        <!-- Clickable Aura Badge for Secret Code -->
        <div class="aura-badge" id="auraDisplay" onclick="unlockInfiniteAura()" title="Click to enter secret code">
            ✨ <span id="auraTokens">500</span> Aura
        </div>

        <button class="btn-secondary" onclick="clearChat()">New Chat</button>
        <button class="btn-primary" id="signInBtn" onclick="openModal()">Sign In</button>
        <div class="user-profile" id="userProfile">
            <div class="user-avatar" id="avatarIcon">G</div>
            <span class="user-name" id="profileName">Guest</span>
            <button class="btn-secondary" style="padding: 4px 8px; font-size: 11px; margin-left: 4px;" onclick="signOut()">Exit</button>
        </div>
    </div>
</header>

<div class="main-container">
    <div id="home-screen">
        <div class="hero-logo">
            <svg viewBox="0 0 24 24"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>
        </div>
        <h1 class="hero-title" id="welcomeTitle">Namaste, Guest</h1>
        <p class="hero-subtitle">Aaj main aapki kya help kar sakta hoon?</p>

        <div class="cards-grid">
            <div class="card" onclick="quickSend('Generate an image of a futuristic neon cyberpunk city')">
                <span class="card-text">AI Image Generator (100 Aura)...</span>
                <span class="card-icon">🖼️</span>
            </div>
            <div class="card" onclick="quickSend('Mujhe ek creative story likhkar do.')">
                <span class="card-text">Mujhe ek creative story likhkar do (+10 Aura)...</span>
                <span class="card-icon">💡</span>
            </div>
            <div class="card" onclick="quickSend('15 aur 25 ka LCM aur HCF kya hoga?')">
                <span class="card-text">Math Problem Solver (+10 Aura)...</span>
                <span class="card-icon">🧠</span>
            </div>
            <div class="card" onclick="quickSend('Ek HTML CSS button ka aesthetic code do.')">
                <span class="card-text">Coding Assistant (+10 Aura)...</span>
                <span class="card-icon">⚡</span>
            </div>
        </div>
    </div>

    <div id="chat-box"></div>
</div>

<div class="input-container">
    <div class="input-box">
        <input type="text" id="userInput" placeholder="Jay AI se kuch bhi poochein ya 'Image of...' type karein..." onkeypress="handleKey(event)">
        <button class="send-btn" onclick="sendMessage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>
</div>

<div class="modal-overlay" id="authModal">
    <div class="modal-card">
        <button class="close-btn" onclick="closeModal()">✕</button>
        <h2 class="modal-title">Sign In to Jay AI</h2>
        <p class="modal-subtitle">Apne account me login karein</p>
        
        <input type="text" class="form-input" id="authName" placeholder="Aapka Naam Enter Karein">
        <input type="email" class="form-input" id="authEmail" placeholder="Email Address">
        
        <button class="btn-primary" style="width: 100%; padding: 12px; margin-top: 6px; border-radius: 24px;" onclick="handleLogin()">Sign In</button>
        
        <div style="margin: 16px 0; font-size: 12px; color: #8e8e93;">OR</div>
        
        <button class="google-btn" onclick="handleGoogleLogin()">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            Continue with Google
        </button>
    </div>
</div>

<script>
    const API_KEY = "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";

    let userAura = localStorage.getItem("jay_ai_aura");
    let isInfiniteAura = localStorage.getItem("jay_ai_infinite") === "true";

    if (userAura === null) {
        userAura = 500;
    } else {
        userAura = parseInt(userAura);
    }

    function updateAuraUI() {
        if (isInfiniteAura) {
            document.getElementById("auraTokens").innerText = "∞ Infinite";
            localStorage.setItem("jay_ai_infinite", "true");
        } else {
            document.getElementById("auraTokens").innerText = userAura;
            localStorage.setItem("jay_ai_aura", userAura);
        }
    }

    updateAuraUI();

    // Secret Code Activation
    function unlockInfiniteAura() {
        const code = prompt("Secret Aura Code Enter Karein:");
        if (code === "123321") {
            isInfiniteAura = true;
            updateAuraUI();
            alert("✨ Mubarak ho! Infinite Aura Activated! Ab aap unlimited photo generate kar sakte hain.");
        } else if (code !== null) {
            alert("Galat Code! Access Denied.");
        }
    }

    const savedName = localStorage.getItem("jay_ai_user");
    if (savedName) {
        updateUserUI(savedName);
    }

    let chatHistory = [
        {
            role: "system",
            content: "Aapka naam Jay AI hai. Aap ek logical thinker aur smart AI assistant ho. Har sawal ka jawab bilkul soch-samajhkar, logically aur simple Hinglish me do."
        }
    ];

    const aiIconSVG = `<svg viewBox="0 0 24 24"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>`;

    function openModal() { document.getElementById("authModal").style.display = "flex"; }
    function closeModal() { document.getElementById("authModal").style.display = "none"; }

    function handleLogin() {
        const nameInput = document.getElementById("authName").value.trim();
        const emailInput = document.getElementById("authEmail").value.trim();

        let finalName = nameInput;
        if (!finalName && emailInput) {
            finalName = emailInput.split('@')[0];
        }

        if (finalName) {
            updateUserUI(finalName);
            closeModal();
        } else {
            alert("Kripya apna naam enter karein!");
        }
    }

    function handleGoogleLogin() {
        const name = prompt("Google Login: Kripya apna naam darj karein:");
        if (name && name.trim() !== "") {
            updateUserUI(name.trim());
            closeModal();
        }
    }

    function updateUserUI(name) {
        localStorage.setItem("jay_ai_user", name);
        document.getElementById("signInBtn").style.display = "none";
        document.getElementById("userProfile").style.display = "flex";
        document.getElementById("profileName").innerText = name;
        document.getElementById("avatarIcon").innerText = name.charAt(0).toUpperCase();
        document.getElementById("welcomeTitle").innerText = "Namaste, " + name;
    }

    function signOut() {
        localStorage.removeItem("jay_ai_user");
        document.getElementById("signInBtn").style.display = "block";
        document.getElementById("userProfile").style.display = "none";
        document.getElementById("welcomeTitle").innerText = "Namaste, Guest";
    }

    function quickSend(promptText) {
        document.getElementById("userInput").value = promptText;
        sendMessage();
    }

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const chatBox = document.getElementById("chat-box");
        const homeScreen = document.getElementById("home-screen");
        const text = inputField.value.trim();

        if (!text) return;

        const isImageReq = text.toLowerCase().includes("image") || text.toLowerCase().includes("photo") || text.toLowerCase().includes("draw") || text.toLowerCase().includes("picture");

        if (isImageReq && !isInfiniteAura && userAura < 100) {
            alert("Aapke paas kam se kam 100 Aura hone chahiye photo generate karne ke liye! Aura badge par click karke secret code enter karein.");
            return;
        }

        if (homeScreen.style.display !== "none") {
            homeScreen.style.display = "none";
            chatBox.style.display = "flex";
        }

        chatBox.innerHTML += `
            <div class="msg-row user-row">
                <div class="msg user">${escapeHtml(text)}</div>
            </div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        const loadingId = "loading-" + Date.now();
        chatBox.innerHTML += `
            <div class="msg-row ai-row" id="${loadingId}">
                <div class="avatar ai-avatar">${aiIconSVG}</div>
                <div class="msg ai typing-cursor">${isImageReq ? 'AI Image banayi ja rahi hai...' : 'Jay AI soch raha hai...'}</div>
            </div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        if (isImageReq) {
            if (!isInfiniteAura) {
                userAura -= 100;
                updateAuraUI();
            }

            setTimeout(() => {
                const loadingDiv = document.getElementById(loadingId);
                const msgContainer = loadingDiv.querySelector(".msg");
                msgContainer.classList.remove("typing-cursor");
                
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=1024&height=1024&nologo=true`;
                msgContainer.innerHTML = `Yeh lijiye aapki generated image:<br><img src="${imageUrl}" class="gen-img" alt="AI Generated Image" onload="scrollBottom()">`;
            }, 1000);
            return;
        }

        if (!isInfiniteAura) {
            userAura += 10;
            updateAuraUI();
        }

        chatHistory.push({ role: "user", content: text });

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + API_KEY.trim(),
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "openai/gpt-oss-120b",
                    messages: chatHistory,
                    temperature: 0.3
                })
            });

            const data = await response.json();
            const loadingDiv = document.getElementById(loadingId);
            const msgContainer = loadingDiv.querySelector(".msg");
            
            if (data.error) {
                msgContainer.classList.remove("typing-cursor");
                msgContainer.innerText = "Error: " + data.error.message;
            } else {
                const reply = data.choices[0].message.content;
                chatHistory.push({ role: "assistant", content: reply });
                typeEffect(msgContainer, reply, chatBox);
            }
        } catch (error) {
            const loadingDiv = document.getElementById(loadingId);
            const msgContainer = loadingDiv.querySelector(".msg");
            msgContainer.classList.remove("typing-cursor");
            msgContainer.innerText = "Error: Network issue. Connection check karein.";
        }
    }

    function scrollBottom() {
        const chatBox = document.getElementById("chat-box");
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function typeEffect(element, text, chatBox) {
        element.innerHTML = "";
        element.classList.add("typing-cursor");
        let i = 0;
        const speed = 10;

        function type() {
            if (i < text.length) {
                element.innerHTML = formatResponse(text.substring(0, i + 1));
                i++;
                chatBox.scrollTop = chatBox.scrollHeight;
                setTimeout(type, speed);
            } else {
                element.classList.remove("typing-cursor");
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
        type();
    }

    function handleKey(e) { if (e.key === "Enter") sendMessage(); }

    function clearChat() {
        document.getElementById("chat-box").innerHTML = "";
        document.getElementById("chat-box").style.display = "none";
        document.getElementById("home-screen").style.display = "flex";
        chatHistory = [chatHistory[0]];
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function formatResponse(text) {
        return escapeHtml(text).replace(/\n/g, "<br>").replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");
    }
</script>

</body>
</html>
